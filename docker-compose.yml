services:
  bmkg:
    build: ./services/bmkg
    env_file:
      - ./services/bmkg/.env
    ports:
      - "8081:8081"
    volumes:
      - bmkg-data:/app/data

  pvmbg:
    build: ./services/pvmbg
    env_file:
      - ./services/pvmbg/.env
    ports:
      - "8082:8082"
    volumes:
      - pvmbg-data:/app/data

  bnpb:
    build:
      context: ./services
      dockerfile: bnpb/Dockerfile
    env_file:
      - ./services/bnpb/.env
    ports:
      - "8085:8085"
    volumes:
      - bnpb-data:/app/data
    depends_on:
      - bmkg
      - pvmbg

  auth:
    build: ./services/auth
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DB_PATH: /app/data/auth.db
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: 60
      REFRESH_TOKEN_TTL_HOURS: 24
      MEDIA_USER_PASSWORD: ${MEDIA_USER_PASSWORD}
      FIELD_USER_PASSWORD: ${FIELD_USER_PASSWORD}
      INTERNAL_USER_PASSWORD: ${INTERNAL_USER_PASSWORD}
    volumes:
      - auth-data:/app/data

  client-api:
    build: ./services/client-api
    ports:
      - "9080:8080"
    env_file:
      - ./services/client-api/.env
    depends_on:
      - bnpb
      - auth

volumes:
  bmkg-data:
  pvmbg-data:
  bnpb-data:
  auth-data:
