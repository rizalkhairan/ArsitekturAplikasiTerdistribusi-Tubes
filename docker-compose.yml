services:
  bmkg:
    build: ./services/bmkg
    env_file:
      - ./services/bmkg/.env
    ports:
      - "8081:8081"
    volumes:
      - bmkg-data:/app/data

  pvmbg:
    build: ./services/pvmbg
    env_file:
      - ./services/pvmbg/.env
    ports:
      - "8082:8082"
    volumes:
      - pvmbg-data:/app/data

volumes:
  bmkg-data:
  pvmbg-data:
