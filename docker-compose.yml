services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  topic-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic hazard-events --partitions 3 --replication-factor 1 --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic hazard-events-dlq --partitions 1 --replication-factor 1 --config retention.ms=604800000
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic field-reports --partitions 3 --replication-factor 1 --config retention.ms=604800000

  ingest-pipeline:
    build: ./services/ingest-pipeline
    environment:
      PIPELINE_MODE: api
      HTTP_ADDR: :8094
      PIPELINE_DB_PATH: /app/data/ingest.db
      KAFKA_BROKERS: kafka:9092
      FIELD_REPORT_TOPIC: field-reports
      FIELD_REPORT_GROUP: field-report-consumer-group
      FIELD_REPORT_TOKEN: ${FIELD_REPORT_TOKEN:-local-dev-field-report-token}
      AUDIT_TOKEN: ${AUDIT_TOKEN:-local-dev-audit-token}
      OPS_TOKEN: ${OPS_TOKEN:-local-dev-ops-token}
      PIPELINE_INTERNAL_TOKEN: ${PIPELINE_INTERNAL_TOKEN:-local-dev-pipeline-internal-token}
      BNPB_REPROCESS_URL: http://bnpb:8085
      BNPB_INTERNAL_KEY: ${INTERNAL_API_KEY}
      MAX_MESSAGE_BYTES: 262144
      MAX_QUARANTINE_BYTES: 4194304
    volumes:
      - ingest-data:/app/data
    ports:
      - "8094:8094"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8094/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      topic-init:
        condition: service_completed_successfully

  field-report-consumer:
    build: ./services/ingest-pipeline
    environment:
      PIPELINE_MODE: consumer
      HTTP_ADDR: :8094
      PIPELINE_DB_PATH: /app/data/ingest.db
      KAFKA_BROKERS: kafka:9092
      FIELD_REPORT_TOPIC: field-reports
      FIELD_REPORT_GROUP: field-report-consumer-group
      FIELD_REPORT_TOKEN: ${FIELD_REPORT_TOKEN:-local-dev-field-report-token}
      AUDIT_TOKEN: ${AUDIT_TOKEN:-local-dev-audit-token}
      OPS_TOKEN: ${OPS_TOKEN:-local-dev-ops-token}
      PIPELINE_INTERNAL_TOKEN: ${PIPELINE_INTERNAL_TOKEN:-local-dev-pipeline-internal-token}
      MAX_MESSAGE_BYTES: 262144
      MAX_QUARANTINE_BYTES: 4194304
    volumes:
      - ingest-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8094/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      ingest-pipeline:
        condition: service_healthy


  bnpb:
    build:
      context: .
      dockerfile: services/bnpb/Dockerfile
    env_file:
      - ./services/bnpb/.env
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INGEST_PIPELINE_URL: http://ingest-pipeline:8094
      PIPELINE_INTERNAL_TOKEN: ${PIPELINE_INTERNAL_TOKEN:-local-dev-pipeline-internal-token}
      COORDINATOR_URL: http://coordinator:8080
      COORDINATOR_TOKEN: ${COORDINATOR_TOKEN:-local-dev-coordinator-token}
      STORAGE_URL: http://canonical-store:8080
      STORAGE_TOKEN: ${CANONICAL_WRITE_TOKEN:-local-dev-canonical-write-token}
      DLQ_URL: http://ingest-pipeline:8094
      DLQ_TOKEN: ${PIPELINE_INTERNAL_TOKEN:-local-dev-pipeline-internal-token}
      AUDIT_TOKEN: ${AUDIT_TOKEN:-local-dev-audit-token}
      NOTIFIER_URL: http://field-notifier:8080
      NOTIFIER_TOKEN: ${NOTIFIER_TOKEN:-local-dev-notifier-token}
      SENSOR_URL: http://sensor-pantai:8080
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-local-dev-pantai-token}
      INSTANCE_ID: bnpb-compose
      KAFKA_ENABLED: "true"
      MIRROR_LOCAL_DB: "true"
    volumes:
      - bnpb-data:/app/data
    ports:
      - "8086:8080"
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      bmkg:
        condition: service_started
      pvmbg:
        condition: service_started
      ingest-pipeline:
        condition: service_healthy
      coordinator:
        condition: service_started
      canonical-store:
        condition: service_started
      field-notifier:
        condition: service_started
      sensor-pantai:
        condition: service_started

  dashboard-updater:
    build: ./services/dashboard-updater
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
      KAFKA_DLQ_TOPIC: hazard-events-dlq
      HEALTH_ADDR: :8080
    ports:
      - "8091:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      topic-init:
        condition: service_completed_successfully

  notifier:
    build: ./services/notifier
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
      KAFKA_DLQ_TOPIC: hazard-events-dlq
      HEALTH_ADDR: :8080
      NOTIFIER_PROCESSING_DELAY: 0s
    ports:
      - "8092:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      topic-init:
        condition: service_completed_successfully

  # This deploys independently; BNPB is unaware of this consumer.
  analytics-consumer:
    build: ./services/analytics-consumer
    profiles: ["analytics"]
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
      KAFKA_DLQ_TOPIC: hazard-events-dlq
      HEALTH_ADDR: :8080
    ports:
      - "8093:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      topic-init:
        condition: service_completed_successfully

  bmkg:
    build: ./services/bmkg
    env_file:
      - ./services/bmkg/.env
    ports:
      - "8081:8081"
    volumes:
      - bmkg-data:/app/data

  pvmbg:
    build: ./services/pvmbg
    env_file:
      - ./services/pvmbg/.env
    ports:
      - "8082:8082"
    volumes:
      - pvmbg-data:/app/data

  auth:
    build: ./services/auth
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DB_PATH: /app/data/auth.db
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: 60
      REFRESH_TOKEN_TTL_HOURS: 24
      MEDIA_USER_PASSWORD: ${MEDIA_USER_PASSWORD}
      FIELD_USER_PASSWORD: ${FIELD_USER_PASSWORD}
      INTERNAL_USER_PASSWORD: ${INTERNAL_USER_PASSWORD}
    volumes:
      - auth-data:/app/data

  client-api:
    build:
      context: .
      dockerfile: services/client-api/Dockerfile
    ports:
      - "9080:8080"
    env_file:
      - ./services/client-api/.env
    environment:
      AUTH_SERVICE_URL: http://auth:8000
      JWT_SECRET: ${JWT_SECRET}
      BNPB_API_URL: http://bnpb:8085
      BNPB_INTERNAL_KEY: ${INTERNAL_API_KEY}
      INGEST_PIPELINE_URL: http://ingest-pipeline:8094
      FIELD_REPORT_TOKEN: ${FIELD_REPORT_TOKEN:-local-dev-field-report-token}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-200}
      RESERVED_FIELD_CAPACITY: ${RESERVED_FIELD_CAPACITY:-80}
    depends_on:
      - bnpb
      - auth
      - ingest-pipeline

  canonical-contract-stub:
    image: python:3.12-slim
    profiles: ["p4-test"]
    working_dir: /workspace
    command: ["python", "tools/contract-stub/server.py", "--host", "0.0.0.0", "--port", "8095"]
    environment:
      AUDIT_TOKEN: p4-local-audit-token
      WRITE_TOKEN: p4-local-write-token
    volumes:
      - ./tools/contract-stub:/workspace/tools/contract-stub:ro
      - ./contracts/m2:/workspace/contracts/m2:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 3s
      timeout: 2s
      retries: 20

  satellite-mock:
    image: python:3.12-slim
    profiles: ["p4-test"]
    working_dir: /app
    command: ["python", "server.py"]
    environment:
      PORT: 8098
      SATELLITE_MOCK_TOKEN: local-satellite-test-token
    volumes:
      - ./tools/satellite-mock/server.py:/app/server.py:ro
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8098),2).close()"]
      interval: 3s
      timeout: 2s
      retries: 20

  satellite-processor:
    build:
      context: ./services
      dockerfile: satellite-processor/Dockerfile
    profiles: ["p4-test"]
    environment:
      SATELLITE_BASE_URL: ${P4_FEED_URL:-http://satellite-mock:8098}
      SATELLITE_TOKEN: ${P4_FEED_TOKEN:-local-satellite-test-token}
      SATELLITE_START_OFFSET: ${P4_START_OFFSET:-0}
      SATELLITE_ALLOWED_LATENESS: 6h
      SATELLITE_STATE_PATH: /app/data/${P4_DB_FILE:-satellite.db}
      SATELLITE_HTTP_ADDR: :8080
      SATELLITE_BATCH_SIZE: 128
      SATELLITE_RECONNECT_MIN: 200ms
      SATELLITE_RECONNECT_MAX: 2s
      CANONICAL_API_URL: ${P4_CANONICAL_URL:-http://canonical-contract-stub:8095}
      CANONICAL_WRITE_TOKEN: ${P4_CANONICAL_TOKEN:-p4-local-write-token}
      CANONICAL_PARTITION: SATELIT
      CANONICAL_EPOCH: 1
      PROVINCE_CENTROIDS_PATH: /app/config/province-centroids.json
      P4_TEST_MODE: "true"
      P4_TEST_TOKEN: local-p4-test-token
      OTEL_SERVICE_NAME: satellite-processor
      OTEL_TRACES_EXPORTER: none
      METRICS_ADDR: :9090
    volumes:
      - satellite-data:/app/data
      - ${P4_PROVINCE_FILE:-./services/satellite-processor/testdata/province-centroids.json}:/app/config/province-centroids.json:ro
    ports:
      - "8096:8080"
      - "9096:9090"
    depends_on:
      canonical-contract-stub:
        condition: service_healthy
      satellite-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/satellite-processor", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    environment:
      STATE_PATH: /data/coordinator.json
      ADDR: ":8080"
      COORDINATOR_TOKEN: ${COORDINATOR_TOKEN:-local-dev-coordinator-token}
    volumes:
      - coordinator-data:/data
    ports:
      - "8099:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  canonical-store:
    build:
      context: .
      dockerfile: services/canonical-store/Dockerfile
    environment:
      DATA_PATH: /data/events.json
      ADDR: ":8080"
      WRITE_TOKEN: ${CANONICAL_WRITE_TOKEN:-local-dev-canonical-write-token}
      AUDIT_TOKEN: ${AUDIT_TOKEN:-local-dev-audit-token}
      NODE_NAME: local
      POD_NAME: canonical-store-compose
      STORAGE_UNIT: canonical-0
    volumes:
      - canonical-data:/data
    ports:
      - "8095:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  field-notifier:
    build:
      context: .
      dockerfile: services/field-notifier/Dockerfile
    environment:
      ADDR: ":8080"
      NOTIFIER_TOKEN: ${NOTIFIER_TOKEN:-local-dev-notifier-token}
    ports:
      - "8097:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  sensor-pantai:
    image: sustuna/sensor-pantai@sha256:51fbd90d3891ad6e9f5768ad330ffb65205644cb29e50da65c7538f2e0b4397d
    environment:
      PANTAI_PROFILE: ${PANTAI_PROFILE:-practice}
      PANTAI_SEED: ${PANTAI_SEED:-42}
      PANTAI_SPEED: ${PANTAI_SPEED:-60}
      PANTAI_AUTH_TOKEN: ${PANTAI_AUTH_TOKEN:-local-dev-pantai-token}
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  kafka-data:
  bmkg-data:
  pvmbg-data:
  bnpb-data:
  auth-data:
  ingest-data:
  satellite-data:
  coordinator-data:
  canonical-data:
