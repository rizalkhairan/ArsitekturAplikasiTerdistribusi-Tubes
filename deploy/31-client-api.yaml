apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-api
  labels: {app: client-api, role: api}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: client-api}
  template:
    metadata:
      labels: {app: client-api, role: api}
    spec:
      containers:
        - name: client-api
          image: bnpb-gateway/client-api:m2
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: bnpb-config}
          env:
            - {name: PORT, value: "8080"}
            - {name: UPSTREAM_TIMEOUT, value: 4s}
            - {name: UPSTREAM_RETRIES, value: "1"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: JWT_SECRET}}
            - name: BNPB_INTERNAL_KEY
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: INTERNAL_API_KEY}}
            - name: FIELD_REPORT_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: FIELD_REPORT_TOKEN}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: client-api
spec:
  type: NodePort
  selector: {app: client-api}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30081}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: client-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: client-api}
