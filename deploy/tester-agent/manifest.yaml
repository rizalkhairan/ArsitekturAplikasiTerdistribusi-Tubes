apiVersion: v1
kind: Namespace
metadata: {name: tester-agent, labels: {app: tester-agent}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: tester-agent, namespace: tester-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tester-agent-coordination, namespace: tester-agent}
rules:
  - {apiGroups: ["coordination.k8s.io"], resources: ["leases"], verbs: ["get", "list", "create", "update"]}
  - {apiGroups: [""], resources: ["configmaps"], verbs: ["get", "create", "update", "delete"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tester-agent-coordination, namespace: tester-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tester-agent-coordination}
subjects: [{kind: ServiceAccount, name: tester-agent, namespace: tester-agent}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tester-agent-app, namespace: sistem-informasi-kebencanaan-bnpb}
rules:
  - {apiGroups: [""], resources: ["pods"], verbs: ["list", "delete"]}
  - {apiGroups: [""], resources: ["services"], verbs: ["list"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tester-agent-app, namespace: sistem-informasi-kebencanaan-bnpb}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tester-agent-app}
subjects: [{kind: ServiceAccount, name: tester-agent, namespace: tester-agent}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: tester-agent-nodes}
rules:
  - {apiGroups: [""], resources: ["nodes"], verbs: ["list"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: tester-agent-nodes}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tester-agent-nodes}
subjects: [{kind: ServiceAccount, name: tester-agent, namespace: tester-agent}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: tester-agent, namespace: tester-agent, labels: {app: tester-agent}}
spec:
  selector: {matchLabels: {app: tester-agent}}
  updateStrategy: {type: RollingUpdate}
  template:
    metadata: {labels: {app: tester-agent}}
    spec:
      serviceAccountName: tester-agent
      priorityClassName: system-node-critical
      tolerations: [{operator: Exists}]
      hostNetwork: true
      hostPID: true
      containers:
        - name: agent
          image: sustuna/tester-agent@sha256:b3143da159cf23a8744ede12b847da6208353754234d53a5a7b46d071cf277ec
          env:
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: TESTER_NAMESPACE, value: tester-agent}
            - {name: TESTER_APP_NAMESPACE, value: sistem-informasi-kebencanaan-bnpb}
            - {name: TESTER_HOST_ROOT, value: /host}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - {name: key, mountPath: /var/run/tester, readOnly: true}
            - {name: host-root, mountPath: /host}
      volumes:
        - name: key
          secret: {secretName: tester-key, optional: true}
        - name: host-root
          hostPath: {path: /}
