# DEV-ONLY placeholder credentials. Never put real secrets here.
# For the demo, replace this Secret (or create `deploy/secrets.yaml`, which is
# gitignored) and keep `pantai-token` in sync with the Sensor Pantai deployment.
apiVersion: v1
kind: Secret
metadata:
  name: bnpb-secrets
type: Opaque
stringData:
  INTERNAL_API_KEY: dev-internal-key
  COORDINATOR_TOKEN: dev-coordinator-token
  STORAGE_TOKEN: dev-canonical-write-token
  DLQ_TOKEN: dev-pipeline-internal-token
  PIPELINE_INTERNAL_TOKEN: dev-pipeline-internal-token
  AUDIT_TOKEN: dev-audit-token
  OPS_TOKEN: dev-ops-token
  FIELD_REPORT_TOKEN: dev-field-report-token
  NOTIFIER_TOKEN: dev-notifier-token
  JWT_SECRET: dev-jwt-secret
  BMKG_API_KEY: dev-bmkg-key
  PVMBG_TOKEN: dev-pvmbg-token
  PANTAI_AUTH_TOKEN: dev-pantai-token
  P4_FEED_TOKEN: dev-satellite-token
  MEDIA_USER_PASSWORD: media-pass-2026
  FIELD_USER_PASSWORD: field-pass-2026
  INTERNAL_USER_PASSWORD: internal-pass-2026
  PVMBG_ADMIN_USERNAME: admin
  PVMBG_ADMIN_PASSWORD: dev-admin-password
---
# Same value is used by the sensor pod and by the Aggregator sensor client.
apiVersion: v1
kind: Secret
metadata:
  name: pantai-token
type: Opaque
stringData:
  token: dev-pantai-token
