apiVersion: v1
kind: Service
metadata:
  name: bnpb
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app.kubernetes.io/name: bnpb
    app.kubernetes.io/part-of: bnpb
  ports:
  - name: http
    port: 8085
    targetPort: http
  - name: health
    port: 8080
    targetPort: health
  - name: metrics
    port: 9090
    targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: bnpb
  ports:
  - name: http
    port: 8000
    targetPort: http
  - name: metrics
    port: 9090
    targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: client-api
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  selector:
    app.kubernetes.io/name: client-api
    app.kubernetes.io/part-of: bnpb
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30080
  type: NodePort
---
apiVersion: v1
