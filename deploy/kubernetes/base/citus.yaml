# Portable lean Citus storage.
#
# Node contract (set labels once per cluster):
#   kubectl label node <control> bnpb.io/role=control bnpb.io/app-eligible=false
#   kubectl label node <app>     bnpb.io/role=app     bnpb.io/app-eligible=true
#   kubectl label node <store>   bnpb.io/role=store   bnpb.io/app-eligible=true
#
# Storage contract: the cluster must provide a `local-path` StorageClass
# (k3s default). No host path or node IP is embedded in these manifests.
apiVersion: v1
kind: Service
metadata:
  name: citus-coordinator
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, citus: "true"}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: citus-coordinator}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Service
metadata:
  name: citus-worker-1
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, citus: "true"}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: citus-worker-1}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Service
metadata:
  name: citus-worker-2
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, citus: "true"}
spec:
