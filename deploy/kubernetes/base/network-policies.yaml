apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tester-agent
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tester-agent
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bnpb
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bnpb
      app.kubernetes.io/part-of: bnpb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: client-api
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: field-report-consumer
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: satellite-processor
          app.kubernetes.io/part-of: bnpb
    ports:
    - protocol: TCP
      port: 8085
---
