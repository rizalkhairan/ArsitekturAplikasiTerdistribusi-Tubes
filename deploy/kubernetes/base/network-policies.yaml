apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/part-of: bnpb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: bnpb
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dashboard-updater
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: notifier
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: analytics-consumer
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: field-report-consumer
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: satellite-processor
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: topic-init
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: client-api
          app.kubernetes.io/part-of: bnpb
