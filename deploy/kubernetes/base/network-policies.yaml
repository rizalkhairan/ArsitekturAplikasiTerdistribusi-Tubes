  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: client-api
      app.kubernetes.io/part-of: bnpb
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canonical-storage
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      role: store
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: bnpb
    ports:
    - protocol: TCP
      port: 5432
  - from:
    - podSelector:
        matchLabels:
          role: store
          app.kubernetes.io/part-of: bnpb
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8008
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-telemetry-scrapes
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/part-of: bnpb
    ports:
    - protocol: TCP
      port: 9090
