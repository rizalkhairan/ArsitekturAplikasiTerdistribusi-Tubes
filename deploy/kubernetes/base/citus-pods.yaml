# Directly scheduled Citus pods. This bypasses the Kubernetes scheduler and
# StatefulSet controller so storage remains usable even while the control
# plane's controller-manager lease is recovering.
apiVersion: v1
kind: Pod
metadata:
  name: citus-coordinator
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: citus-coordinator
    app.kubernetes.io/part-of: bnpb
    citus: "true"
    role: store
spec:
  nodeName: node-control
  restartPolicy: Always
  terminationGracePeriodSeconds: 30
  securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
  containers:
  - name: postgres
    image: bnpb.local/canonical:pg16-citus13.0.1-patroni4.1.5-a08
    imagePullPolicy: IfNotPresent
    command: ["/usr/local/bin/docker-entrypoint.sh"]
    args: ["postgres"]
    env:
    - {name: POSTGRES_USER, value: postgres}
    - {name: POSTGRES_DB, value: canonical}
    - {name: PGDATA, value: /data/pgdata}
    - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
    - name: POSTGRES_PASSWORD
      valueFrom: {secretKeyRef: {name: bnpb-canonical-cluster, key: PATRONI_SUPERUSER_PASSWORD}}
    ports: [{name: postgres, containerPort: 5432}]
    resources: {requests: {memory: 256Mi}, limits: {memory: 1Gi}}
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    startupProbe:
      exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432", -U, postgres]}
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60
    livenessProbe:
      exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432", -U, postgres]}
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 12
    readinessProbe:
      exec: {command: [pg_isready, -h, 127.0.0.1, -p, "5432", -U, postgres]}
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 6
    volumeMounts:
    - {name: data, mountPath: /data}
    - {name: run, mountPath: /var/run/postgresql}
    - {name: tmp, mountPath: /tmp}
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: canonical-a-primary-data}
  - name: run
    emptyDir: {}
  - name: tmp
    emptyDir: {}
---
