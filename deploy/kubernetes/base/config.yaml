# Kubernetes baseline for the current M1 application; see deploy/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bnpb-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  DB_PATH: /app/data/bnpb.db
  DB_READ_CONNECTIONS: '8'
  BNPB_API_PORT: '8085'
  HEALTH_ADDR: :8080
  POLL_INTERVAL: 3s
  UPSTREAM_TIMEOUT: 5s
  KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
  KAFKA_CLIENT_ID: bnpb-aggregator
  OUTBOX_POLL_INTERVAL: 1s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bmkg-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  PORT: '8081'
  DB_PATH: /app/data/bmkg.db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvmbg-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  PORT: '8082'
  DB_PATH: /app/data/pvmbg.db
  PVMBG_MIN_DELAY_MS: '500'
  PVMBG_MAX_DELAY_MS: '3000'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  PORT: '8000'
  DB_PATH: /app/data/auth.db
  ACCESS_TOKEN_TTL_SECONDS: '60'
  REFRESH_TOKEN_TTL_HOURS: '24'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: client-api-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  PORT: '8080'
  UPSTREAM_TIMEOUT: 5s
  MAX_CONCURRENT_REQUESTS: '100'
  MAX_LIMIT: '100'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-updater-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  HEALTH_ADDR: :8080
  KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
  KAFKA_DLQ_TOPIC: hazard-events-dlq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifier-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  HEALTH_ADDR: :8080
  KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
  KAFKA_DLQ_TOPIC: hazard-events-dlq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-consumer-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  HEALTH_ADDR: :8080
  KAFKA_TOPIC_HAZARD_EVENTS: hazard-events
  KAFKA_DLQ_TOPIC: hazard-events-dlq
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: sistem-informasi-kebencanaan-bnpb
data:
  KAFKA_NODE_ID: '1'
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
