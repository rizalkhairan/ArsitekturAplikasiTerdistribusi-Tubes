# Portable application PVCs. The k3s local-path provisioner creates node-local
# hostPath volumes on first use; no node name or host path is embedded here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bnpb-m1-data
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
