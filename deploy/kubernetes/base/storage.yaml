# Kubernetes baseline for the current M1 application; see deploy/README.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: bnpb-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bnpb-bnpb-m1
  labels:
    app.kubernetes.io/part-of: bnpb
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bnpb-local
  claimRef:
    namespace: sistem-informasi-kebencanaan-bnpb
    name: bnpb-m1-data
  local:
    path: /var/lib/bnpb/bnpb-m1
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - node-control
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bnpb-m1-data
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: bnpb-local
  volumeName: bnpb-bnpb-m1
  resources:
    requests:
      storage: 5Gi
