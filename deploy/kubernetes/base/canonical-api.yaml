apiVersion: v1
kind: Service
metadata:
  name: canonical-api
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, app.kubernetes.io/name: canonical-api}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: canonical-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: canonical-api
  namespace: sistem-informasi-kebencanaan-bnpb
  labels:
    app.kubernetes.io/name: canonical-api
    app.kubernetes.io/part-of: bnpb
    role: app
spec:
  nodeName: node-control
  restartPolicy: Always
  terminationGracePeriodSeconds: 15
  securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
  containers:
  - name: canonical-api
    image: bnpb-gateway/aggregator:m2
    imagePullPolicy: IfNotPresent
    command: ["/opt/canonical-api/canonical-api"]
    env:
    - name: CANONICAL_DSN
      valueFrom: {secretKeyRef: {name: bnpb-citus-api, key: CANONICAL_DSN}}
    - {name: ADDR, value: ":8080"}
    - {name: KAFKA_TOPIC_HAZARD_EVENTS, value: hazard-events}
    ports: [{name: http, containerPort: 8080}]
    resources: {requests: {memory: 64Mi}, limits: {memory: 256Mi}}
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    readinessProbe:
      httpGet: {path: /readyz, port: http}
      initialDelaySeconds: 3
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      httpGet: {path: /health, port: http}
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    volumeMounts:
    - {name: bin, mountPath: /opt/canonical-api, readOnly: true}
  volumes:
  - name: bin
    hostPath: {path: /var/lib/bnpb/canonical-api, type: Directory}
