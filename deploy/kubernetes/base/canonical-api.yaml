apiVersion: v1
kind: Service
metadata:
  name: canonical-api
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, app.kubernetes.io/name: canonical-api}
spec:
  selector: {app.kubernetes.io/name: canonical-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# Compatibility alias for scripts/Aggregator builds that still use the M1 name.
apiVersion: v1
kind: Service
metadata:
  name: canonical-store
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, app.kubernetes.io/name: canonical-api}
spec:
  selector: {app.kubernetes.io/name: canonical-api}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canonical-api
  namespace: sistem-informasi-kebencanaan-bnpb
  labels: {app.kubernetes.io/part-of: bnpb, app.kubernetes.io/name: canonical-api}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: canonical-api}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: canonical-api
        app.kubernetes.io/part-of: bnpb
        role: other
    spec:
      nodeSelector: {bnpb.io/app-eligible: "true"}
      terminationGracePeriodSeconds: 15
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
      containers:
      - name: canonical-api
        image: bnpb-gateway/aggregator:m2
        imagePullPolicy: IfNotPresent
        command: ["/app/canonical-api"]
        envFrom:
        - configMapRef: {name: citus-node-map, optional: true}
        - configMapRef: {name: bnpb-config, optional: true}
        env:
        - name: CANONICAL_DSN
          valueFrom: {secretKeyRef: {name: bnpb-citus-api, key: CANONICAL_DSN}}
        - name: COORDINATOR_TOKEN
          valueFrom: {secretKeyRef: {name: bnpb-secrets, key: COORDINATOR_TOKEN}}
        - {name: ADDR, value: ":8080"}
        - {name: KAFKA_TOPIC_HAZARD_EVENTS, value: hazard-events}
        ports: [{name: http, containerPort: 8080}]
        resources:
          requests: {memory: 128Mi, cpu: 50m}
          limits: {memory: 256Mi, cpu: 500m}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        volumeMounts:
        - name: citus-node-map
          mountPath: /etc/citus-node-map
          readOnly: true
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          httpGet: {path: /health, port: http}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
      # Storage-side reconciler: runs in the canonical-api pod because that pod
      # is the identity the Citus isolation policy admits on 5432. It restores
      # RF2 copies when a worker is unreachable or its placements were removed.
      # The advisory lock in the command keeps the two replicas from copying
      # at the same time.
      - name: replica-reconciler
        image: bnpb-gateway/aggregator:m2
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - "while true; do /app/canonical-admin reconcile-replicas; sleep 30; done"
        env:
        - name: CANONICAL_ADMIN_DSN
          valueFrom: {secretKeyRef: {name: bnpb-citus-admin, key: CANONICAL_ADMIN_DSN}}
        resources:
          requests: {memory: 128Mi, cpu: 10m}
          limits: {memory: 256Mi, cpu: 200m}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
      - name: citus-node-map
        configMap:
          name: citus-node-map
          optional: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: canonical-api
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: canonical-api}
