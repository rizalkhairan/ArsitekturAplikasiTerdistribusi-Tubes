# Kubernetes baseline for the current M1 application; see deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnpb
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bnpb
      app.kubernetes.io/part-of: bnpb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bnpb
        app.kubernetes.io/part-of: bnpb
        app.kubernetes.io/component: aggregator
        role: aggregator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: bnpb
        image: bnpb.local/bnpb:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8085
        - name: health
          containerPort: 8080
        resources:
          requests:
            memory: 256Mi
          limits:
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: bnpb-config
        env:
        - name: OTEL_SERVICE_NAME
          value: bnpb
        - name: TZ
          value: UTC
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: BMKG_GRPC_ADDR
          valueFrom:
            configMapKeyRef:
              name: bnpb-platform
              key: BMKG_GRPC_ADDR
        - name: PVMBG_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: bnpb-platform
              key: PVMBG_BASE_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: bnpb-platform
              key: KAFKA_BROKERS
        - name: BMKG_API_KEY
          valueFrom:
            secretKeyRef:
              name: bnpb-bmkg-auth
              key: api-key
        - name: PVMBG_TOKEN
          valueFrom:
            secretKeyRef:
              name: bnpb-pvmbg-auth
              key: token
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: bnpb-m1-internal-auth
              key: key
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          httpGet: &id001
            path: /health
            port: health
          periodSeconds: 5
          failureThreshold: 36
          timeoutSeconds: 3
        readinessProbe:
          httpGet: *id001
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          httpGet: *id001
          periodSeconds: 10
          failureThreshold: 6
          timeoutSeconds: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: bnpb-m1-data
      nodeSelector:
        aggregator-eligible: 'true'
---
