global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
- job_name: application
  static_configs:
  - targets:
    - bnpb:9090
    labels:
      service: bnpb
  - targets:
    - client-api-metrics:9090
    labels:
      service: client-api
  - targets:
    - auth:9090
    labels:
      service: auth
  - targets:
    - bmkg:9090
    labels:
      service: bmkg
  - targets:
    - pvmbg:9090
    labels:
      service: pvmbg
  - targets:
    - dashboard-updater:9090
    labels:
      service: dashboard-updater
  - targets:
    - notifier:9090
    labels:
      service: notifier
  - targets:
    - analytics-consumer:9090
    labels:
      service: analytics-consumer
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
