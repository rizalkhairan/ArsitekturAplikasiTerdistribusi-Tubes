kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sistem-informasi-kebencanaan-bnpb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: sistem-informasi-kebencanaan-bnpb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  namespace: sistem-informasi-kebencanaan-bnpb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: sistem-informasi-kebencanaan-bnpb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: sistem-informasi-kebencanaan-bnpb
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: sistem-informasi-kebencanaan-bnpb
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-pod-logs
  namespace: sistem-informasi-kebencanaan-bnpb
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: sistem-informasi-kebencanaan-bnpb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-pod-logs
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: sistem-informasi-kebencanaan-bnpb
