apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: bnpb
        app.kubernetes.io/component: telemetry
        role: other
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: false
      nodeSelector:
        bnpb.io/app-eligible: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: docker.io/grafana/alloy:v1.10.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 12345
        env:
        - name: GOMEMLIMIT
          value: 180MiB
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/observability
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: kube-api
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        args:
        - run
        - --server.http.listen-addr=0.0.0.0:12345
        - --storage.path=/data
        - /etc/observability/config.alloy
        readinessProbe:
          httpGet: &id001
            path: /-/ready
            port: 12345
          periodSeconds: 5
          timeoutSeconds: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          tcpSocket:
            port: 12345
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: data
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir: {}
      - name: kube-api
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
