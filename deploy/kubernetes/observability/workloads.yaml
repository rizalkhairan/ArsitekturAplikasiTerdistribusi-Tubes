apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: bnpb
        app.kubernetes.io/component: telemetry
        role: other
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: false
      nodeSelector:
        bnpb.io/app-eligible: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: docker.io/prom/prometheus:v3.5.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
        env:
        - name: GOMEMLIMIT
          value: 180MiB
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/observability
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        args:
        - --config.file=/etc/observability/config.yaml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=6h
        - --storage.tsdb.retention.size=384MB
        - --query.max-concurrency=2
        readinessProbe:
          httpGet: &id001
            path: /-/ready
            port: 9090
          periodSeconds: 5
          timeoutSeconds: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          tcpSocket:
            port: 9090
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: bnpb
        app.kubernetes.io/component: telemetry
        role: other
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      nodeSelector:
        bnpb.io/app-eligible: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:12.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GOMEMLIMIT
          value: 180MiB
        - name: GF_PATHS_DATA
          value: /data
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        - name: GF_PATHS_PLUGINS
          value: /data/plugins
        - name: GF_PATHS_LOGS
          value: /data/logs
        - name: GF_PATHS_PROVISIONING
          value: /etc/observability/provisioning
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_LOG_MODE
          value: console
        - name: GF_LOG_CONSOLE_FORMAT
          value: json
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bnpb-grafana-auth
              key: admin-password
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/observability
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet: &id001
            path: /api/health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
        startupProbe:
          httpGet: *id001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 15
          failureThreshold: 6
          timeoutSeconds: 3
      volumes:
      - name: config
        configMap:
          name: grafana-config
          items:
          - key: datasources.yaml
            path: provisioning/datasources/default.yaml
          - key: dashboards.yaml
            path: provisioning/dashboards/default.yaml
          - key: services.json
            path: dashboards/services.json
      - name: data
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir: {}
---
