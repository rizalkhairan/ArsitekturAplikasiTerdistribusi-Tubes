---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-otel-collector
  namespace: sistem-informasi-kebencanaan-bnpb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/part-of: bnpb
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: bnpb
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: client-api
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: auth
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: bmkg
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: pvmbg
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: dashboard-updater
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: notifier
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: analytics-consumer
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: satellite-processor
          app.kubernetes.io/part-of: bnpb
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: field-report-consumer
          app.kubernetes.io/part-of: bnpb
    ports:
    - protocol: TCP
      port: 4318
