apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: canonical-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canonical-store
  labels: {app: canonical-store, role: store}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: canonical-store}
  template:
    metadata:
      labels: {app: canonical-store, role: store}
    spec:
      # kind uses value "" and k3s uses "true" for the control-plane role.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: canonical-store
          image: bnpb-gateway/canonical-store:m2
          imagePullPolicy: IfNotPresent
          env:
            - {name: ADDR, value: ":8080"}
            - {name: DATA_PATH, value: /data/events.json}
            - {name: STORAGE_UNIT, value: canonical-0}
            - {name: STORAGE_CLASS, value: local-path}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: WRITE_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: STORAGE_TOKEN}}
            - name: AUDIT_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: AUDIT_TOKEN}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: canonical-data}
---
apiVersion: v1
kind: Service
metadata:
  name: canonical-store
spec:
  selector: {app: canonical-store}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
