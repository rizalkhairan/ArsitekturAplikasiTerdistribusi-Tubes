apiVersion: v1
kind: ConfigMap
metadata:
  name: bnpb-config
data:
  # Every dependency URL is here so components can be replaced by editing this map.
  COORDINATOR_URL: http://coordinator:8080
  STORAGE_URL: http://canonical-api:8080
  DLQ_URL: http://ingest-pipeline:8094
  INGEST_PIPELINE_URL: http://ingest-pipeline:8094
  NOTIFIER_URL: http://field-notifier:8080
  SENSOR_URL: http://sensor-pantai:8080
  BMKG_GRPC_ADDR: bmkg:8081
  PVMBG_BASE_URL: http://pvmbg:8082
  BNPB_API_URL: http://aggregator:8085
  AUTH_SERVICE_URL: http://auth:8000

  POLL_INTERVAL: 3s
  # Persist at most this many reports per tick so a large backlog still
  # advances the checkpoint between transient write failures.
  PVMBG_BATCH_LIMIT: "100"
  BMKG_BATCH_LIMIT: "100"
  # Canonical writes serialize on the partition authority row; 4s timed out
  # under node load before the redundant lease transaction was removed.
  UPSTREAM_TIMEOUT: 15s
  AUDIT_TIMEOUT: 90s
  UPSTREAM_RETRIES: "1"
  STALENESS_THRESHOLD: 10s
  READ_CACHE_TTL: 30s
  LEASE_TTL: 15s
  LEASE_RENEW_INTERVAL: 5s
  LEASE_SAFETY_MARGIN: 2s
  SHUTDOWN_DRAIN: 5s

  # P2/P5 do not require C's broker. The critical-alert outbox is B-owned.
  KAFKA_ENABLED: "false"
  MIRROR_LOCAL_DB: "false"

  SENSOR_POLL_INTERVAL: 2s
  SENSOR_TIMEOUT: 3s
  # A buoy may legitimately be silent between bursts; 45s tripped the breaker
  # while the sensor was healthy. Failures and slowness still trip it sooner.
  SENSOR_STALE_AFTER: 180s
  SENSOR_PAGE_LIMIT: "100"
  SENSOR_MAX_PAGES: "20"
  SENSOR_CURSOR_OVERLAP: 5m
  SENSOR_STATIONS_REFRESH: 10m
  SENSOR_QUALITY_ENUM: ok,good,fair,poor,degraded,unknown
  SENSOR_SEA_LEVEL_MIN: "-10"
  SENSOR_SEA_LEVEL_MAX: "10"
  SENSOR_WAVE_MIN: "0"
  SENSOR_WAVE_MAX: "50"
  SENSOR_MAX_FUTURE: 5m
  SENSOR_SIAGA_WAVE_M: "4"
  SENSOR_SIAGA_SEA_M: "1.5"
  SENSOR_WASPADA_WAVE_M: "2"
  SENSOR_WASPADA_SEA_M: "0.75"

  MAX_CONCURRENT_REQUESTS: "200"
  RESERVED_FIELD_CAPACITY: "80"
  MAX_LIMIT: "100"
  TOKEN_TTL_SECONDS: "60"
  # Spans are exported to the collector's OTLP/HTTP receiver; the collector
  # forwards them to Tempo. Empty disables export.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
