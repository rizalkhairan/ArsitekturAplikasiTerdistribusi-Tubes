apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: field-report-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: field-report-consumer
  labels: {app: field-report-consumer, role: consumer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: field-report-consumer}
  template:
    metadata:
      labels: {app: field-report-consumer, role: consumer}
    spec:
      containers:
        - name: field-report-consumer
          image: bnpb-gateway/ingest-pipeline:m2
          imagePullPolicy: IfNotPresent
          env:
            - {name: PIPELINE_MODE, value: consumer}
            - {name: HTTP_ADDR, value: ":8094"}
            - {name: PIPELINE_DB_PATH, value: /app/data/ingest.db}
            - {name: KAFKA_BROKERS, value: kafka:9092}
            - {name: FIELD_REPORT_TOPIC, value: field-reports}
            - {name: FIELD_REPORT_GROUP, value: field-report-consumer-group}
            - name: AUDIT_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: AUDIT_TOKEN}}
            - name: OPS_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: OPS_TOKEN}}
            - name: FIELD_REPORT_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: FIELD_REPORT_TOKEN}}
            - name: PIPELINE_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: PIPELINE_INTERNAL_TOKEN}}
          ports:
            - {name: health, containerPort: 8094}
          readinessProbe: {httpGet: {path: /health, port: 8094}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8094}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: field-report-data}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-updater
  labels: {app: dashboard-updater, role: consumer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard-updater}
  template:
    metadata:
      labels: {app: dashboard-updater, role: consumer}
    spec:
      containers:
        - name: dashboard-updater
          image: bnpb-gateway/dashboard-updater:m2
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BROKERS, value: kafka:9092}
            - {name: KAFKA_TOPIC_HAZARD_EVENTS, value: hazard-events}
            - {name: KAFKA_DLQ_TOPIC, value: hazard-events-dlq}
            - {name: HEALTH_ADDR, value: ":8080"}
          ports:
            - {name: health, containerPort: 8080}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels: {app: notifier, role: consumer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: notifier}
  template:
    metadata:
      labels: {app: notifier, role: consumer}
    spec:
      containers:
        - name: notifier
          image: bnpb-gateway/notifier:m2
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BROKERS, value: kafka:9092}
            - {name: KAFKA_TOPIC_HAZARD_EVENTS, value: hazard-events}
            - {name: KAFKA_DLQ_TOPIC, value: hazard-events-dlq}
            - {name: HEALTH_ADDR, value: ":8080"}
            - {name: NOTIFIER_PROCESSING_DELAY, value: "0s"}
          ports:
            - {name: health, containerPort: 8080}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-consumer
  labels: {app: analytics-consumer, role: consumer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: analytics-consumer}
  template:
    metadata:
      labels: {app: analytics-consumer, role: consumer}
    spec:
      containers:
        - name: analytics-consumer
          image: bnpb-gateway/analytics-consumer:m2
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BROKERS, value: kafka:9092}
            - {name: KAFKA_TOPIC_HAZARD_EVENTS, value: hazard-events}
            - {name: KAFKA_DLQ_TOPIC, value: hazard-events-dlq}
            - {name: HEALTH_ADDR, value: ":8080"}
          ports:
            - {name: health, containerPort: 8080}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-updater
spec:
  selector: {app: dashboard-updater}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
spec:
  selector: {app: notifier}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-consumer
spec:
  selector: {app: analytics-consumer}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
