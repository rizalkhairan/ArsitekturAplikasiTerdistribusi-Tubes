apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels: {app: auth, role: api}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: auth}
  template:
    metadata:
      labels: {app: auth, role: api}
    spec:
      containers:
        - name: auth
          image: bnpb-gateway/auth:m2
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
            - {name: metrics, containerPort: 9090}
          env:
            - {name: PORT, value: "8000"}
            - {name: DB_PATH, value: /app/data/auth.db}
            - {name: ACCESS_TOKEN_TTL_SECONDS, value: "60"}
            - {name: REFRESH_TOKEN_TTL_HOURS, value: "24"}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: JWT_SECRET}}
            - name: MEDIA_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: MEDIA_USER_PASSWORD}}
            - name: FIELD_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: FIELD_USER_PASSWORD}}
            - name: INTERNAL_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: INTERNAL_USER_PASSWORD}}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: auth-data}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector: {app: auth}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: metrics, port: 9090, targetPort: 9090}
