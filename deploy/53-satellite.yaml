apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: satellite-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-processor
  labels: {app: satellite-processor, role: consumer}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: satellite-processor}
  template:
    metadata:
      labels: {app: satellite-processor, role: consumer}
    spec:
      containers:
        - name: satellite-processor
          image: bnpb-gateway/satellite-processor:m2
          imagePullPolicy: IfNotPresent
          env:
            - {name: SATELLITE_BASE_URL, value: "https://satellite.naufarrel.dev"}
            - name: SATELLITE_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: P4_FEED_TOKEN}}
            - {name: SATELLITE_START_OFFSET, value: "0"}
            - {name: SATELLITE_ALLOWED_LATENESS, value: 6h}
            - {name: SATELLITE_STATE_PATH, value: /app/data/satellite.db}
            - {name: SATELLITE_HTTP_ADDR, value: ":8080"}
            - {name: SATELLITE_BATCH_SIZE, value: "128"}
            - {name: SATELLITE_RECONNECT_MIN, value: 1s}
            - {name: SATELLITE_RECONNECT_MAX, value: 30s}
            - {name: CANONICAL_API_URL, value: "http://canonical-store:8080"}
            - name: CANONICAL_WRITE_TOKEN
              valueFrom: {secretKeyRef: {name: bnpb-secrets, key: STORAGE_TOKEN}}
            - {name: CANONICAL_PARTITION, value: SATELIT}
            - {name: CANONICAL_EPOCH, value: "1"}
            - {name: PROVINCE_CENTROIDS_PATH, value: /app/config/province-centroids.json}
            - {name: METRICS_ADDR, value: ":9090"}
            - {name: P4_TEST_MODE, value: "false"}
            - {name: OTEL_SERVICE_NAME, value: satellite-processor}
            - {name: OTEL_TRACES_EXPORTER, value: none}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: config, mountPath: /app/config, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: satellite-data}
        - name: config
          configMap: {name: satellite-province-centroids}
---
apiVersion: v1
kind: Service
metadata:
  name: satellite-processor
spec:
  selector: {app: satellite-processor}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
    - {name: metrics, port: 9090, targetPort: 9090}
